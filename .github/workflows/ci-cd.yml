name: CI/CD Pipeline

on: [ push, pull_request ]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_NAME: ${{ vars.GCP_REPO_NAME }}
  IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}
  DATASET_ID: ${{ vars.GCP_DATASET_ID }}
  BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
  JOB_NAME: ${{ vars.GCP_JOB_NAME }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check ram_miner tests

      - name: Type check with mypy
        run: mypy --config-file pyproject.toml ram_miner tests

      - name: Run Unit Tests
        run: pytest

  continuous-deployment:
    needs: continuous-integration
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run Job
        run: |
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tasks 1 \
            --parallelism 1 \
            --region ${{ env.REGION }} \
            --service-account scrapy-bigquery-loader@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --command scrapy \
            --args crawl,azerty \
            --memory 1Gi \
            --set-env-vars RUN_ENV=prod,GCS_BUCKET_NAME=${{ env.BUCKET_NAME }},GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_DATASET_ID=${{ env.DATASET_ID }} \
            --max-retries 0

      - name: Ensure 4 AM Schedule
        run: |
            gcloud scheduler jobs update http daily-scrapy-trigger \
              --location ${{ env.REGION }} \
              --schedule "0 4 * * *" \
              --time-zone "Europe/Paris" \
              --uri "https://${{ env.REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.PROJECT_ID }}/jobs/${{ env.JOB_NAME }}:run" \
              --http-method POST \
              --oauth-service-account-email scrapy-bigquery-loader@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
              || gcloud scheduler jobs create http daily-scrapy-trigger \
              --location ${{ env.REGION }} \
              --schedule "0 4 * * *" \
              --time-zone "Europe/Paris" \
              --uri "https://${{ env.REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.PROJECT_ID }}/jobs/${{ env.JOB_NAME }}:run" \
              --http-method POST \
              --oauth-service-account-email scrapy-bigquery-loader@${{ env.PROJECT_ID }}.iam.gserviceaccount.com